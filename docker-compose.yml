services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      CAPTAIN_SERVICE_URL: http://captain-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
    depends_on:
      - user-service
      - captain-service
      - payment-service

  user-service:
    build: ./user-service
    env_file: ./user-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/uber_users
    depends_on:
      - mongo

  captain-service:
    build: ./captain-service
    env_file: ./captain-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/uber_captains
    depends_on:
      - mongo

  payment-service:
    build: ./payment-service
    env_file: ./payment-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/uber_payments
      CAPTAIN_SERVICE_URL: http://captain-service:3002
    depends_on:
      - mongo
      - captain-service

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
